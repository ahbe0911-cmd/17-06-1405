name: Clean Zaffran Gram Bootstrap History

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/history-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recreate the current source as a clean root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zaffran Gram Builder'
          git config user.email 'actions@users.noreply.github.com'
          git archive --format=tar HEAD -o /tmp/zaffran-source.tar
          git switch --orphan zaffran-clean-history
          git rm -rf --ignore-unmatch .
          tar -xf /tmp/zaffran-source.tar

          grep -Fq "buildConfigField 'int', 'APP_ID', '0'" TMessagesProj/build.gradle
          grep -Fq "buildConfigField 'String', 'APP_HASH', '\"\"'" TMessagesProj/build.gradle
          test ! -e TMessagesProj/config/release.keystore
          test ! -e TMessagesProj/config/test.keystore
          test ! -e TMessagesProj/google-services.json
          test ! -e TMessagesProj_App/google-services.json
          test ! -e TMessagesProj_AppStandalone/google-services.json
          test ! -d .bootstrap

          git add -A
          git commit -m 'Initialize Zaffran Gram secure base'
          git push --force origin HEAD:main
